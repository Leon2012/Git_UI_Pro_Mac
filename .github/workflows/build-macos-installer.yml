name: Build macOS Installer

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build-macos:
    name: Build macOS arm64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify runner architecture
        run: npm run verify:macos

      - name: Typecheck
        run: npm run typecheck

      - name: Build macOS installer
        run: npm run dist:mac -- --publish never

      - name: Verify macOS arm64 artifacts
        run: node scripts/verify-macos-arm64-artifacts.mjs release

      - name: Upload macOS installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: git-ui-pro-macos-arm64
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
          if-no-files-found: error
